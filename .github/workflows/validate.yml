name: Validate Food Passport
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject merge-conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo "Merge conflict markers found"
            exit 1
          fi
      - name: Validate food database
        run: |
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/foods.json','utf8'));
          if(x.version!=='1.6.2') throw new Error('Expected data version 1.6.2');
          if(x.districts.length!==64) throw new Error('District count must be 64');
          const ids=[], slugs=new Set(), errors=[];
          for(const d of x.districts){
            if(slugs.has(d.slug)) errors.push('duplicate district slug '+d.slug);
            slugs.add(d.slug);
            if(!Array.isArray(d.foods)||d.foods.length<2) errors.push('district must have at least 2 foods '+d.slug);
            for(const f of d.foods){
              ids.push(f.id);
              for(const key of ['id','name','en','category','emoji','note']){
                if(!f[key]) errors.push(`${f.id||d.slug}: missing ${key}`);
              }
              const linked=!!(f.verified&&f.source);
              const curated=f.curation==='community_curated';
              if(!linked&&!curated) errors.push(`${f.id}: must be source-linked or curated`);
              if(curated&&f.image) errors.push(`${f.id}: curated entry cannot use a photo`);
              if(f.photo_status==='verified_food_photo'){
                if(!linked) errors.push(`${f.id}: verified photo requires source-linked entry`);
                if(!f.image||!f.image_source) errors.push(`${f.id}: verified photo requires image + image_source`);
                if(f.photo_scope!=='regional_exact') errors.push(`${f.id}: verified photo must be regional_exact`);
              } else if(f.image) {
                errors.push(`${f.id}: non-verified photo must be blank`);
              }
            }
          }
          if(new Set(ids).size!==ids.length) errors.push('duplicate food IDs');
          if(errors.length) throw new Error(errors.join('\n'));
          console.log({
            districts:x.districts.length,
            foods:ids.length,
            referenceLinked:x.verified_count,
            curated:x.curated_count,
            exactPhotos:x.photo_count
          });
          NODE
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
